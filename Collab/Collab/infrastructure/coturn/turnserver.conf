# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  coturn — TURN/STUN relay for CoLab calls (LIVE: collab.resulticks.com).   ║
# ║                                                                            ║
# ║  AUTH MODE: STATIC long-term credentials (lt-cred-mech).                    ║
# ║  The backend (backend/app/src/services/livekitService.ts) sends a FIXED     ║
# ║  username/password from TURN_USERNAME / TURN_PASSWORD (config/src/index.ts  ║
# ║  -> config.turn) verbatim — it does NOT compute an HMAC. So we use a static ║
# ║  `user=` line, NOT use-auth-secret. The user / password / realm below MUST  ║
# ║  match .env.live byte-for-byte.                                             ║
# ║                                                                            ║
# ║  Runs with network_mode: host on the SFU box (10.200.3.17, see             ║
# ║  docker-compose.live.yml). External browsers relay media here over          ║
# ║  turns:5349 (TLS) / turn:3478, and coturn forwards it to the SFU's ICE      ║
# ║  candidate 10.200.3.17:7532 — which is why the allowed-peer-ip exception    ║
# ║  for 10.200.3.17 below is REQUIRED.                                         ║
# ║                                                                            ║
# ║  external-ip / relay-ip are NOT set here on purpose — coturn does NOT       ║
# ║  expand ${ENV} inside this file. They are passed on the command line from   ║
# ║  docker-compose.live.yml (which DOES expand ${COTURN_PUBLIC_IP}). See that  ║
# ║  service's `command:`.                                                      ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ── Listeners ────────────────────────────────────────────────────────────
# Plain TURN/STUN (UDP+TCP) on 3478, TURN-over-TLS (TLS/DTLS) on 5349.
# The live public relay (34.74.165.103 / turncollab.resulticks.com) listens on
# 3478 (3479 is also held open at the firewall); 5349 + 443 carry turns: (TLS).
# These match what TURN_URLS advertises in .env.live.
listening-port=3478
tls-listening-port=5349

# TURN-over-TLS on 443 — REQUIRED for "works on ANY network". 443 looks like
# HTTPS, so it is the only transport that reliably traverses locked-down mobile /
# corporate / hotel networks. KEEP THIS ENABLED. Constraint: the site's public
# 443 is owned by the app LB (forwards 443 -> nginx). So turncollab.resulticks.com
# MUST resolve to a SEPARATE public IP where coturn owns 443 (host networking
# binds it here), with a TLS cert valid for that name. Only if you truly cannot
# give coturn its own public 443: comment this line + drop the :443 entry from
# TURN_URLS — but then the most restrictive networks may fail. See
# docs/DEPLOY_LIVE_CALLS_FIX.md.
alt-tls-listening-port=443

# Bind all interfaces (host networking).
listening-ip=0.0.0.0
# external-ip / relay-ip are supplied via the compose `command:` args
# (--external-ip / --relay-ip = ${COTURN_PUBLIC_IP}), NOT here, because coturn
# does not expand environment variables inside this config file.

# ── Authentication: STATIC long-term credential (matches the backend) ─────
lt-cred-mech
# realm is advertised to the browser in coturn's auth challenge. Pinned to the
# domain. (With a literal `user=` line the realm does not enter credential
# computation, but it must be a stable, sensible value.)
realm=collab.resulticks.com
# user=<TURN_USERNAME>:<TURN_PASSWORD>, copied LITERALLY from .env.live.
# The password contains shell-special chars ($ ! # @ ^ & *) — inside
# turnserver.conf they are NOT special; coturn reads to end-of-line. Do NOT
# quote or escape. (The single quotes in .env.live are dotenv quoting only and
# are NOT part of the password.)
user=collab-turn:8V$kR2!mQ9#zL4@xT7^nP1&cY6*Wj3HgF5sD
# Ephemeral/REST path intentionally NOT enabled (no use-auth-secret /
# no static-auth-secret) so a stray secret can't shadow the static user and the
# auth mode stays unambiguous.

# ── UDP relay port range — MUST be open on the host firewall/security group ─
min-port=49152
max-port=49251

# ── TLS material for turns: (5349 + optional 443). Mount real certs valid for
#    turncollab.resulticks.com (the host in TURN_URLS) at the path below. ────
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.key

# ── Hardening / hygiene ───────────────────────────────────────────────────
fingerprint
stale-nonce=600
no-cli
# Log to stdout so `docker logs colab-coturn` shows TURN activity — client
# allocations, auth, and relay sessions. Needed to verify the relay is working.
# `verbose` is chatty; remove it once calls are confirmed.
log-file=stdout
verbose
new-log-timestamp
no-tlsv1
no-tlsv1_1
no-multicast-peers
# Don't relay to loopback/link-local of the box itself.
no-loopback-peers

# ── Peer ACL ───────────────────────────────────────────────────────────────
# coturn treats allowed-peer-ip as an explicit whitelist exception that
# OVERRIDES the denied-peer-ip ranges (regardless of list order). We allow ONLY
# the SFU's internal media IP so the relay can forward to LiveKit
# (10.200.3.17:7532) while the rest of RFC1918 stays denied — no open relay /
# SSRF hole. Without this allow, the 10.0.0.0/8 deny below blocks the SFU and
# every external (relayed) call fails DTLS.
allowed-peer-ip=10.200.3.17
# Teams/test-tier SFU (livekit.test.yaml node_ip). Harmless on the live deploy
# (whose SFU is 10.200.3.17, never 10.205.11.8) — listing both lets ONE shared
# coturn config serve both the teams and live tiers.
allowed-peer-ip=10.205.11.8
allowed-peer-ip=10.200.3.64
# Block everything else private/bogon to prevent open-relay abuse / SSRF.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-fe80::ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
