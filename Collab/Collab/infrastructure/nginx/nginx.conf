upstream backend { server backend:4000; }
upstream livekit_signal { server livekit:7534; }
upstream minio { server minio:9003; }
# NOTE: `frontend` is intentionally NOT a static upstream. nginx resolves every
# static upstream at startup and REFUSES TO BOOT if one is missing — so a
# not-running frontend container (host-run Next dev, Electron-only, or a stack
# brought up without the web build) used to crash-loop nginx and take the whole
# site — including /api and /socket.io — DOWN. Instead the `/` location below
# resolves `frontend` lazily at request time (via the Docker DNS resolver), so
# nginx always boots and the API/websocket/LiveKit routes keep serving; only the
# web UI itself 502s when the frontend really is absent.

# ── MODE B (opt-in): desktop frontend upstream ───────────────────────────────
# Routes a desktop hostname/path to the separate `frontend-desktop` container
# (docker-compose.live.yml, profile "desktop"). KEEP COMMENTED until you actually
# run Mode B: nginx resolves every upstream at startup and REFUSES TO BOOT if one
# is missing, so an active upstream pointing at a not-running frontend-desktop
# would take nginx (and the whole site) DOWN on the normal `up`. Uncomment BOTH
# this upstream AND the `/desktop-app` location below ONLY when frontend-desktop
# is up (`--profile desktop`). See docs/ENTERPRISE_DEPLOYMENT.md.
# upstream frontend_desktop { server frontend-desktop:3000; }

# This nginx ONLY runs behind a TLS terminator (corporate LB on 443, or the
# public domain). TLS is always terminated upstream, so the browser-facing
# scheme is always https. Honor the LB's X-Forwarded-Proto if it sends one;
# otherwise assume https. The backend uses this to build wss:// LiveKit URLs
# and same-origin links — a wrong "http" here = mixed-content / broken calls.
map $http_x_forwarded_proto $fwd_proto_lb {
    default $http_x_forwarded_proto;
    ""      https;
}
# EXCEPTION — a browser on THIS machine (a developer running the live stack and
# opening http://localhost:<NGINX_PORT>): there is no TLS terminator in front,
# nginx itself is the edge, and the page is plain http. Forcing "https" here
# handed the browser a wss://localhost/livekit URL (and $host dropped the port),
# so every call/meeting failed with "Couldn't reach the media server". For a
# loopback Host, forward the real scheme and keep the port. Production traffic
# never carries a loopback Host, so it still takes the $fwd_proto_lb path.
map $http_host $fwd_proto {
    ~*^(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$  $scheme;
    default                                     $fwd_proto_lb;
}
map $http_host $fwd_host {
    ~*^(localhost|127\.0\.0\.1|\[::1\])(:\d+)?$  $http_host;
    default                                     $host;
}

server {
    listen 7530;
    server_name _;
    client_max_body_size 2g;

    # Docker's embedded DNS — lets the `/` location resolve `frontend` at request
    # time instead of at boot, so a missing frontend container never crashes nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Backend API (bypasses Next.js proxy for reliability)
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $fwd_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Stream large uploads straight to the backend (which streams them to
        # object storage) instead of spooling 2 GB to a temp file; and allow a
        # slow-link 2 GB transfer to exceed the 60s default.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Socket.IO WebSocket
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $fwd_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # LiveKit signalling (WebSocket + HTTP validate). The browser connects to
    # wss://<host>/livekit and the client appends /rtc/v1, so requests arrive as
    # /livekit/rtc/v1[...]. LiveKit serves at /rtc (NO /livekit prefix), so we
    # MUST strip the /livekit prefix before proxying — otherwise LiveKit returns
    # 404 on /livekit/rtc/v1/validate and the call's media connection fails.
    # (Mirrors Caddy's `handle_path /livekit*`.)
    location /livekit {
        rewrite ^/livekit/?(.*)$ /$1 break;
        proxy_pass http://livekit_signal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $fwd_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        # Keep the signalling socket open for the whole call.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # MinIO admin console
    location /minio/ {
        proxy_pass http://minio;
        proxy_http_version 1.1;
        proxy_set_header Host $fwd_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }

    # ── MODE B (opt-in): desktop frontend route ──────────────────────────────
    # Routes the desktop app's traffic to the separate `frontend-desktop`
    # container so the browser-facing `/` route below stays on the frozen web
    # build. The desktop shell points here via COLLAB_WEB_URL (desktop/config.js).
    # KEEP COMMENTED until Mode B is active — see the upstream note at the top of
    # this file (nginx won't boot if frontend_desktop isn't running). Uncomment
    # this block AND the `upstream frontend_desktop` line together.
    #
    # Path-based variant (point COLLAB_WEB_URL at https://<host>/desktop-app):
    # location /desktop-app/ {
    #     rewrite ^/desktop-app/?(.*)$ /$1 break;
    #     proxy_pass http://frontend_desktop;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $fwd_host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $fwd_proto;
    # }
    #
    # Hostname-based variant is cleaner — give the desktop its own server block
    # (e.g. server_name desktop.collab.resulticks.com;) whose `location /` does
    # `proxy_pass http://frontend_desktop;` and keep /api, /socket.io, /livekit,
    # /minio identical to this server. Point COLLAB_WEB_URL at that hostname.

    # Frontend (Next.js) — the browser-facing web build. Resolved lazily via a
    # variable so nginx boots even when the frontend container is absent (see the
    # resolver + upstream note above). Only THIS route 502s when it's down; the
    # API/websocket/LiveKit/MinIO routes stay up.
    # Next dev hot-reload socket — only requested when `frontend` is a host-run
    # `next dev`; the production build never hits this path.
    location /_next/webpack-hmr {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $fwd_host;
        proxy_read_timeout 1h;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $fwd_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
}
